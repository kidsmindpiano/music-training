<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🎹 피아노 연주</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#f8f9fa;overflow:hidden;height:100vh;touch-action:manipulation;user-select:none;color:#333}
#menu{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;z-index:100;background:linear-gradient(135deg,#e8f0fe,#fce4ec,#fff8e1);overflow-y:auto;padding:30px 16px}
#menu.hidden{display:none}
#menu h1{font-size:36px;margin-bottom:4px}
#menu>p{color:#888;margin-bottom:20px;font-size:14px}
.song-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:460px}
.song-card{background:#fff;border:2px solid #eee;border-radius:16px;padding:18px 12px;cursor:pointer;transition:all .2s;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.06)}
.song-card:hover{transform:translateY(-3px);border-color:#7AAED0}
.song-card .icon{font-size:36px;margin-bottom:6px}
.song-card h3{font-size:15px;margin-bottom:4px;color:#5b7fbf}
.song-card p{font-size:11px;color:#999;margin:0}
.diff{display:inline-block;padding:3px 10px;border-radius:8px;font-size:11px;font-weight:700;margin-top:6px}
.diff-easy{background:#6bcb77;color:#fff}
.diff-normal{background:#D4C255;color:#fff}
.back-btn{margin-top:20px;padding:10px 24px;border:none;border-radius:12px;background:rgba(0,0,0,.08);color:#666;font-size:14px;cursor:pointer}
#game{display:none;flex-direction:column;height:100vh}
#game.active{display:flex}
.top-bar{display:flex;align-items:center;padding:8px 12px;gap:10px;background:#fff;border-bottom:1px solid #eee}
.top-bar .close{font-size:22px;color:#999;background:none;border:none;cursor:pointer;padding:4px 8px}
.progress-bar{flex:1;height:10px;background:#eee;border-radius:5px;overflow:hidden}
.progress-fill{height:100%;background:#6bcb77;border-radius:5px;transition:width .3s}
.staff-area{flex:1;position:relative;overflow:hidden;background:#fff}
.staff-canvas{width:100%;height:100%}
.keyboard{position:relative;height:140px;background:#222;display:flex;padding:0 2px}
.white-key{flex:1;background:#fff;border:1px solid #ccc;border-radius:0 0 8px 8px;margin:0 1px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;font-size:11px;font-weight:700;color:#999;cursor:pointer;transition:background .1s}
.white-key.hit-perfect{background:#6bcb77!important}
.white-key.hit-good{background:#D4C255!important}
.white-key.hit-miss{background:#F5B5B0!important}
.black-key{position:absolute;width:8%;height:55%;background:#333;border-radius:0 0 6px 6px;z-index:2;cursor:pointer;transition:background .1s}
.black-key.hit-perfect{background:#6bcb77!important}
.black-key.hit-good{background:#D4C255!important}
.black-key.hit-miss{background:#F5B5B0!important}
.countdown{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.3);z-index:50;font-size:80px;font-weight:900;color:#fff;text-shadow:0 4px 20px rgba(0,0,0,.3)}
.countdown.hidden{display:none}
#result{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#e8f0fe,#fce4ec);z-index:60;padding:20px}
#result.active{display:flex}
#result h2{font-size:28px;margin-bottom:8px}
.stars{font-size:48px;margin:12px 0}
.result-stats{display:flex;gap:20px;margin:16px 0}
.stat{text-align:center}
.stat .num{font-size:28px;font-weight:900}
.stat .label{font-size:12px;color:#888}
.stat.perfect .num{color:#6bcb77}
.stat.good .num{color:#D4C255}
.stat.miss .num{color:#F5B5B0}
.result-btns{display:flex;gap:12px;margin-top:20px}
.result-btn{padding:14px 28px;border:none;border-radius:14px;font-size:16px;font-weight:700;cursor:pointer}
.btn-retry{background:#6A9FC5;color:#fff}
.btn-menu{background:rgba(0,0,0,.08);color:#666}
.feedback{position:absolute;font-size:24px;font-weight:900;z-index:10;pointer-events:none;animation:feedPop .6s ease-out forwards}
@keyframes feedPop{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-40px) scale(1.3)}}
</style>
</head>
<body>
<div id="menu">
  <h1>🎹 피아노 연주</h1>
  <p>오선지를 보고 건반을 눌러봐요!</p>
  <div class="song-grid" id="song-list"></div>
  <button class="back-btn" onclick="location.href='duo.html'">← 뮤직마스터로</button>
</div>
<div id="game">
  <div class="top-bar">
    <button class="close" onclick="endGame()">✕</button>
    <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
  </div>
  <div class="staff-area">
    <canvas class="staff-canvas" id="staff-canvas"></canvas>
    <div class="countdown hidden" id="countdown">3</div>
  </div>
  <div class="keyboard" id="keyboard"></div>
</div>
<div id="result">
  <h2 id="result-title">잘했어요!</h2>
  <div class="stars" id="result-stars">⭐⭐⭐</div>
  <div class="result-stats">
    <div class="stat perfect"><div class="num" id="r-perfect">0</div><div class="label">Perfect</div></div>
    <div class="stat good"><div class="num" id="r-good">0</div><div class="label">Good</div></div>
    <div class="stat miss"><div class="num" id="r-miss">0</div><div class="label">Miss</div></div>
  </div>
  <div class="result-btns">
    <button class="result-btn btn-retry" onclick="retrySong()">다시하기</button>
    <button class="result-btn btn-menu" onclick="goMenu()">목록으로</button>
  </div>
</div>
<script>
const NC={C:'#e74c3c',D:'#e67e22',E:'#f1c40f',F:'#27ae60',G:'#3498db',A:'#2980b9',B:'#8e44ad'};
function nC(n){return NC[n[0]]||'#999'}
const FR={C4:261.63,D4:293.66,E4:329.63,F4:349.23,G4:392,A4:440,B4:493.88,C5:523.25,D5:587.33,E5:659.25,F5:698.46};
const SONGS=[
{id:'twinkle',title:'반짝반짝 작은 별',icon:'⭐',diff:'easy',bpm:100,
 notes:[{n:'C4',d:1},{n:'C4',d:1},{n:'G4',d:1},{n:'G4',d:1},{n:'A4',d:1},{n:'A4',d:1},{n:'G4',d:2},{n:'F4',d:1},{n:'F4',d:1},{n:'E4',d:1},{n:'E4',d:1},{n:'D4',d:1},{n:'D4',d:1},{n:'C4',d:2},{n:'G4',d:1},{n:'G4',d:1},{n:'F4',d:1},{n:'F4',d:1},{n:'E4',d:1},{n:'E4',d:1},{n:'D4',d:2},{n:'G4',d:1},{n:'G4',d:1},{n:'F4',d:1},{n:'F4',d:1},{n:'E4',d:1},{n:'E4',d:1},{n:'D4',d:2},{n:'C4',d:1},{n:'C4',d:1},{n:'G4',d:1},{n:'G4',d:1},{n:'A4',d:1},{n:'A4',d:1},{n:'G4',d:2},{n:'F4',d:1},{n:'F4',d:1},{n:'E4',d:1},{n:'E4',d:1},{n:'D4',d:1},{n:'D4',d:1},{n:'C4',d:2}]},
{id:'mary',title:'메리에겐 작은 양',icon:'🐑',diff:'easy',bpm:110,
 notes:[{n:'E4',d:1},{n:'D4',d:1},{n:'C4',d:1},{n:'D4',d:1},{n:'E4',d:1},{n:'E4',d:1},{n:'E4',d:2},{n:'D4',d:1},{n:'D4',d:1},{n:'D4',d:2},{n:'E4',d:1},{n:'G4',d:1},{n:'G4',d:2},{n:'E4',d:1},{n:'D4',d:1},{n:'C4',d:1},{n:'D4',d:1},{n:'E4',d:1},{n:'E4',d:1},{n:'E4',d:1},{n:'E4',d:1},{n:'D4',d:1},{n:'D4',d:1},{n:'E4',d:1},{n:'D4',d:1},{n:'C4',d:2}]},
{id:'airplane',title:'비행기',icon:'✈️',diff:'easy',bpm:100,
 notes:[{n:'E4',d:1},{n:'D4',d:1},{n:'C4',d:1},{n:'D4',d:1},{n:'E4',d:1},{n:'E4',d:1},{n:'E4',d:2},{n:'D4',d:1},{n:'D4',d:1},{n:'D4',d:2},{n:'E4',d:1},{n:'E4',d:1},{n:'E4',d:2},{n:'E4',d:1},{n:'D4',d:1},{n:'C4',d:1},{n:'D4',d:1},{n:'E4',d:1},{n:'E4',d:1},{n:'E4',d:1},{n:'E4',d:1},{n:'D4',d:1},{n:'D4',d:1},{n:'E4',d:1},{n:'D4',d:1},{n:'C4',d:2}]},
{id:'butterfly',title:'나비야',icon:'🦋',diff:'easy',bpm:100,
 notes:[{n:'G4',d:1},{n:'E4',d:1},{n:'E4',d:2},{n:'F4',d:1},{n:'D4',d:1},{n:'D4',d:2},{n:'C4',d:1},{n:'D4',d:1},{n:'E4',d:1},{n:'F4',d:1},{n:'G4',d:1},{n:'G4',d:1},{n:'G4',d:2},{n:'G4',d:1},{n:'E4',d:1},{n:'E4',d:1},{n:'E4',d:1},{n:'F4',d:1},{n:'D4',d:1},{n:'D4',d:2},{n:'C4',d:1},{n:'E4',d:1},{n:'G4',d:1},{n:'G4',d:1},{n:'C4',d:2},{n:'C4',d:2}]},
{id:'jingle',title:'징글벨',icon:'🔔',diff:'normal',bpm:130,
 notes:[{n:'E4',d:1},{n:'E4',d:1},{n:'E4',d:2},{n:'E4',d:1},{n:'E4',d:1},{n:'E4',d:2},{n:'E4',d:1},{n:'G4',d:1},{n:'C4',d:1},{n:'D4',d:1},{n:'E4',d:4},{n:'F4',d:1},{n:'F4',d:1},{n:'F4',d:1},{n:'F4',d:1},{n:'F4',d:1},{n:'E4',d:1},{n:'E4',d:1},{n:'E4',d:.5},{n:'E4',d:.5},{n:'E4',d:1},{n:'D4',d:1},{n:'D4',d:1},{n:'E4',d:1},{n:'D4',d:2},{n:'G4',d:2}]}
];
const STAFF_Y={};
function calcSY(top,gap){
  const p={F5:-1,E5:0,D5:1,C5:2,B4:3,A4:4,G4:5,F4:6,E4:7,D4:8,C4:9};
  for(const[n,v] of Object.entries(p)) STAFF_Y[n]=top+v*gap*0.5;
}
const KEYS=['C4','D4','E4','F4','G4','A4','B4','C5','D5','E5','F5'];
const KN={C:'도',D:'레',E:'미',F:'파',G:'솔',A:'라',B:'시'};
let synth=null,toneOk=false;
async function initTone(){if(!toneOk){await Tone.start();toneOk=true;}if(!synth)synth=new Tone.PolySynth(Tone.Synth,{oscillator:{type:'triangle'},envelope:{attack:.01,decay:.4,sustain:.2,release:.6},volume:-5}).toDestination();}
function buildKB(){
  const kb=document.getElementById('keyboard');kb.innerHTML='';
  const kw=100/KEYS.length;
  KEYS.forEach(k=>{
    const el=document.createElement('div');el.className='white-key';el.id='key-'+k;
    el.innerHTML=`<span style="color:${nC(k)}">${KN[k[0]]}</span>`;
    const play=()=>hitKey(k);
    el.addEventListener('touchstart',e=>{e.preventDefault();play()},{passive:false});
    el.addEventListener('mousedown',play);
    kb.appendChild(el);
  });
}
let curSong=null,gNotes=[],startT=0,animId=0,perf=0,gd=0,ms=0,playing=false;
const BPX=80,CX=80;

function startSong(i){
  curSong=SONGS[i];
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('game').classList.add('active');
  document.getElementById('result').classList.remove('active');
  buildKB();perf=0;gd=0;ms=0;playing=false;
  gNotes=[];let t=0;
  curSong.notes.forEach(n=>{gNotes.push({note:n.n,start:t,dur:n.d,hit:false,judged:false});t+=n.d;});
  const cd=document.getElementById('countdown');cd.classList.remove('hidden');
  let c=3;cd.textContent=c;
  const ci=setInterval(()=>{c--;if(c>0)cd.textContent=c;else{cd.textContent='🎵';setTimeout(()=>{cd.classList.add('hidden');clearInterval(ci);go();},400);}},800);
}
async function go(){await initTone();playing=true;startT=performance.now();draw();}

function hitKey(note){
  initTone().then(()=>{synth.triggerAttackRelease(FR[note]||440,'8n');});
  const el=document.getElementById('key-'+note);if(!el||!playing)return;
  const now=(performance.now()-startT)/1000,bps=curSong.bpm/60,cb=now*bps;
  let best=null,bd=Infinity;
  for(let i=0;i<gNotes.length;i++){const g=gNotes[i];if(g.judged||g.note!==note)continue;const d=Math.abs(g.start-cb);if(d<bd){bd=d;best=i;}}
  if(best!==null&&bd<1.5){
    const g=gNotes[best];g.judged=true;g.hit=true;
    if(bd<.25){perf++;g.grade='perfect';flash(el,'hit-perfect');fb('Perfect!','#6bcb77');}
    else if(bd<.5){gd++;g.grade='good';flash(el,'hit-good');fb('Good!','#D4C255');}
    else{ms++;g.grade='miss';flash(el,'hit-miss');fb('Miss','#F5B5B0');}
  }
}
function flash(el,c){el.classList.add(c);setTimeout(()=>el.classList.remove(c),300);}
function fb(t,c){const f=document.createElement('div');f.className='feedback';f.textContent=t;f.style.color=c;f.style.left=CX+'px';f.style.top='40%';document.querySelector('.staff-area').appendChild(f);setTimeout(()=>f.remove(),700);}

function draw(){
  if(!playing)return;
  const cv=document.getElementById('staff-canvas'),ctx=cv.getContext('2d');
  const W=cv.parentElement.clientWidth,H=cv.parentElement.clientHeight;
  cv.width=W;cv.height=H;
  const sT=H*.15,sB=H*.85,gap=(sB-sT)/4;
  calcSY(sT,gap);
  const now=(performance.now()-startT)/1000,bps=curSong.bpm/60,cb=now*bps;
  ctx.clearRect(0,0,W,H);
  ctx.strokeStyle='#ddd';ctx.lineWidth=1;
  for(let i=0;i<5;i++){const y=sT+i*gap;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  // Ledger line for C4
  const c4y=STAFF_Y['C4'];
  if(c4y){ctx.strokeStyle='#ddd';ctx.lineWidth=1;}
  // Cursor
  ctx.strokeStyle='rgba(0,0,0,.15)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(CX,sT-20);ctx.lineTo(CX,sB+20);ctx.stroke();
  // Clef
  ctx.font='64px serif';ctx.fillStyle='#ccc';ctx.fillText('𝄞',10,sT+gap*3.2);
  
  const totalB=gNotes.length>0?gNotes[gNotes.length-1].start+gNotes[gNotes.length-1].dur:0;
  let allDone=true;
  gNotes.forEach(g=>{
    const x=CX+(g.start-cb)*BPX,w=g.dur*BPX-4,y=STAFF_Y[g.note];
    if(!y||x+w<-20||x>W+20)return;
    if(!g.judged&&g.start+g.dur<cb-.3){g.judged=true;ms++;g.grade='miss';}
    if(!g.judged)allDone=false;
    const color=nC(g.note);
    ctx.globalAlpha=g.judged?(g.hit?.9:.2):1;
    ctx.fillStyle=color;
    const bh=gap*.7,by=y-bh/2,r=bh/2;
    ctx.beginPath();ctx.moveTo(x+r,by);ctx.lineTo(x+w-r,by);ctx.quadraticCurveTo(x+w,by,x+w,by+r);ctx.lineTo(x+w,by+bh-r);ctx.quadraticCurveTo(x+w,by+bh,x+w-r,by+bh);ctx.lineTo(x+r,by+bh);ctx.quadraticCurveTo(x,by+bh,x,by+bh-r);ctx.lineTo(x,by+r);ctx.quadraticCurveTo(x,by,x+r,by);ctx.fill();
    if(w>30){ctx.fillStyle='#fff';ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.fillText(KN[g.note[0]],x+w/2,y+5);ctx.textAlign='start';}
    ctx.globalAlpha=1;
  });
  document.getElementById('progress').style.width=(Math.min(1,cb/totalB)*100)+'%';
  if(allDone||cb>totalB+2){playing=false;showResult();return;}
  animId=requestAnimationFrame(draw);
}
function showResult(){
  cancelAnimationFrame(animId);
  const tot=perf+gd+ms,pct=tot>0?(perf+gd*.5)/tot:0;
  const s=pct>=.9?3:pct>=.6?2:pct>=.3?1:0;
  document.getElementById('r-perfect').textContent=perf;
  document.getElementById('r-good').textContent=gd;
  document.getElementById('r-miss').textContent=ms;
  document.getElementById('result-stars').textContent='⭐'.repeat(s)+'☆'.repeat(3-s);
  document.getElementById('result-title').textContent=s>=3?'완벽해요! 🎉':s>=2?'잘했어요! 👏':s>=1?'괜찮아요! 💪':'다시 해봐요!';
  document.getElementById('result').classList.add('active');
}
function retrySong(){document.getElementById('result').classList.remove('active');startSong(SONGS.indexOf(curSong));}
function goMenu(){document.getElementById('result').classList.remove('active');document.getElementById('game').classList.remove('active');document.getElementById('menu').classList.remove('hidden');}
function endGame(){playing=false;cancelAnimationFrame(animId);goMenu();}
function renderMenu(){
  const g=document.getElementById('song-list');g.innerHTML='';
  SONGS.forEach((s,i)=>{const c=document.createElement('div');c.className='song-card';c.innerHTML=`<div class="icon">${s.icon}</div><h3>${s.title}</h3><p>${s.notes.length}개 음표</p><div class="diff diff-${s.diff}">${s.diff==='easy'?'쉬움':'보통'}</div>`;c.onclick=()=>startSong(i);g.appendChild(c);});
}
document.addEventListener('touchstart',function t(){if(!toneOk)Tone.start().then(()=>{toneOk=true;});document.removeEventListener('touchstart',t);},{once:true});
renderMenu();
</script>
</body>
</html>
